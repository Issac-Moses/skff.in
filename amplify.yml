version: 1
frontend:
  phases:
    preBuild:
      commands:
        - nvm use 22
        - node -v
        - npm install -g npm@11
        - npm -v
        - npm ci --legacy-peer-deps
    build:
      commands:
        - env NITRO_PRESET=aws-amplify npm run build
  artifacts:
    baseDirectory: .amplify-hosting
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
