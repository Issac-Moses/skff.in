version: 1
frontend:
  phases:
    preBuild:
      commands:
        - nvm use 22
        - node -v
        - npm install -g npm@11
        - npm -v
        - npm ci --cache .npm --prefer-offline
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: dist
    files:
      - '**/*'
  cache:
    paths:
      - .npm/**/*
      - node_modules/**/*
